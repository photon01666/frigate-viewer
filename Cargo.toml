[package]
name = "frigate-viewer"
version = "1.0.0"
edition = "2021"
description = "A native Android shell for the Frigate NVR web UI"
license = "MIT"
publish = false

[lib]
name = "frigate_viewer"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
